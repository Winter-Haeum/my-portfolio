name: Supabase Keep Alive

on:
  schedule:
    # 월·수·금 오전 9시 UTC (한국 오후 6시) — 최대 3일 간격으로 7일 일시정지 방지
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch: # 수동 실행 가능

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase (portfolio_projects)
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/portfolio_projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" -eq 200 ]; then
            echo "Supabase ping successful at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            echo "Supabase ping failed with HTTP $http_code"
            exit 1
          fi
